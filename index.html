<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Заробіток</title>
<meta name="description" content="Заробіток по днях: гривні, долари, євро за курсом НБУ">
<meta name="theme-color" content="#111113">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Заробіток">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{
  --bg:#111113; --card:#18191B; --future:#1C1D20; --cell:#212225; --hover:#272A2D; --pressed:#2E3135;
  --well:#0C0D0E; --line:#363A3F; --lineCtl:#43484E; --lineHi:#696E77;
  --text:#EDEEF0; --text2:#B0B4BA; --text3:#777B84; --accent:#2BB592; --onAccent:#0B1512;
  --err:#FF9592; --errLine:#E5484D;
  --h0:#212225; --h1:#173A31; --h2:#1A4B3F; --h3:#1C5F4F; --h4:#1F7560;
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font:16px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%;
  padding:calc(env(safe-area-inset-top) + 6px) calc(env(safe-area-inset-right) + 12px) calc(env(safe-area-inset-bottom) + 90px) calc(env(safe-area-inset-left) + 12px)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
button:disabled{cursor:default}
#app{max-width:520px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-top:8px}

/* шапка */
.top{display:flex;align-items:center;gap:4px;height:48px}
.top .title{flex:1;font-size:21px;font-weight:600;letter-spacing:-.2px}
.icon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--text2)}
.icon:active{background:var(--pressed)}
.icon:disabled{opacity:.3}
.icon svg{width:22px;height:22px}

/* перемикач валют */
.seg{display:inline-flex;background:var(--cell);border:1px solid var(--lineCtl);border-radius:10px;padding:2px}
.seg button{min-width:44px;height:36px;border-radius:8px;font-size:17px;font-weight:600;color:var(--text2)}
.seg button[aria-pressed=true]{background:var(--pressed);color:var(--text)}

/* головне число */
.hero .row1{display:flex;justify-content:space-between;align-items:center;gap:8px}
.label{font-size:13px;color:var(--text2)}
.big{font-size:30px;font-weight:650;letter-spacing:-.6px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sec{font-size:16px;color:var(--text2);margin-top:2px}
.note{font-size:13px;color:var(--text2);margin-top:8px}
.note.err{color:var(--err)}
.note:empty{display:none}

/* календар */
.wk,.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wk div{text-align:center;font-size:12px;color:var(--text2);padding-bottom:6px}
.c{position:relative;height:46px;border-radius:9px;background:var(--h0);text-align:left;padding:4px 4px 0 6px;overflow:hidden;line-height:1.2}
.c .n{font-size:13px;font-weight:600;color:var(--text)}
.c .v{position:absolute;left:4px;right:2px;bottom:4px;font-size:11px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.3px}
.c.l1{background:var(--h1)}.c.l2{background:var(--h2)}.c.l3{background:var(--h3)}.c.l4{background:var(--h4)}
.c.out{background:transparent}.c.out .n{color:var(--text3);font-weight:400}
.c.fut{background:var(--future)}.c.fut .n{color:var(--text3);font-weight:400}
.c.today .n{color:var(--accent)}
.c.sel{box-shadow:inset 0 0 0 2px var(--accent)}
.c.flash{animation:fl .75s ease-out}
.c.flashErr{animation:fle .75s ease-out}
@keyframes fl{0%{box-shadow:inset 0 0 0 30px rgba(43,181,146,.55)}100%{box-shadow:inset 0 0 0 2px var(--accent)}}
@keyframes fle{0%{box-shadow:inset 0 0 0 30px rgba(229,72,77,.55)}100%{box-shadow:inset 0 0 0 2px var(--accent)}}
.calfoot{display:flex;gap:10px;margin-top:10px;font-size:13px;color:var(--text2)}
.calfoot div{flex:1;min-width:0}
.calfoot b{display:block;color:var(--text);font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* день */
.dayhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.dayhead .d{font-size:18px;font-weight:600}
.dayhead .t{font-size:13px;color:var(--text2);text-align:right}
.dayhead .t b{display:block;color:var(--text);font-size:16px}
.rows{margin-top:10px}
.er{display:flex;width:100%;align-items:center;justify-content:space-between;gap:8px;min-height:52px;padding:6px 10px;border-radius:10px;text-align:left}
.er:active,.er.on{background:var(--hover)}
.er.on{box-shadow:inset 0 0 0 1px var(--accent)}
.er .a{font-size:17px;font-weight:600;white-space:nowrap}
.er .o{font-size:13px;color:var(--text2);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.editor{margin-top:10px}
.inrow{display:flex;gap:8px;align-items:center}
#amt{flex:1;min-width:0;height:50px;border-radius:11px;border:1px solid var(--lineHi);background:var(--well);color:var(--text);
  font:600 20px/1 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;padding:0 14px;outline:none;font-variant-numeric:tabular-nums}
#amt:focus{border-color:var(--accent)}
#amt.bad{border-color:var(--errLine)}
.hint{font-size:13px;color:var(--text2);min-height:18px;margin:7px 2px 0}
.hint.err{color:var(--err)}
.btns{display:flex;gap:8px;margin-top:10px}
.primary{flex:1;height:48px;border-radius:11px;background:var(--accent);color:var(--onAccent);font-weight:650;font-size:17px}
.primary:active{filter:brightness(.9)}
.ghost{height:48px;padding:0 16px;border-radius:11px;border:1px solid var(--lineCtl);background:var(--cell);font-size:16px}
.ghost:active{background:var(--pressed)}
.danger{color:var(--err)}
.link{display:block;margin-top:8px;height:44px;color:var(--accent);font-weight:600;font-size:16px;padding:0 10px}
.rate{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:13px;color:var(--text2);display:flex;justify-content:space-between;gap:10px;align-items:flex-end}
.rate .retry{color:var(--accent);font-weight:600;white-space:nowrap;padding:8px 0 0 8px}
.hidden{display:none!important}
@media (max-width:360px){ .seg button{min-width:38px;font-size:16px} .big{font-size:27px} }

/* рік */
.yhead{display:flex;justify-content:space-between;align-items:baseline}
.yhead b{font-size:18px}
.bars{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;margin-top:12px;align-items:end}
.bar{display:flex;flex-direction:column;align-items:center;gap:5px}
.bar .col{width:100%;height:64px;display:flex;align-items:flex-end}
.bar .col i{display:block;width:100%;min-height:3px;border-radius:4px;background:var(--lineHi)}
.bar.cur .col i{background:var(--accent)}
.bar span{font-size:11px;color:var(--text2)}
.bar:disabled{opacity:.35}
.ynote{font-size:13px;color:var(--text2);margin-top:8px}
.ynote:empty{display:none}

/* банери, тост, меню */
.banner{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 44px 12px 14px;margin-top:10px;font-size:14px;color:var(--text2);position:relative}
.banner b{color:var(--text)}
.banner.err{border-color:var(--errLine);color:var(--err)}
.banner .x{position:absolute;right:4px;top:4px;width:40px;height:40px;color:var(--text2);font-size:20px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 16px);width:calc(100% - 24px);max-width:496px;
  background:var(--pressed);border:1px solid var(--lineHi);border-radius:12px;padding:6px 6px 6px 14px;display:flex;align-items:center;gap:8px;font-size:15px;
  box-shadow:0 8px 24px rgba(0,0,0,.45);z-index:20}
.toast span{flex:1}
.toast button{color:var(--accent);font-weight:650;height:40px;padding:0 10px}
.shade{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:520px;background:var(--card);border-top:1px solid var(--line);border-radius:18px 18px 0 0;
  padding:18px 16px calc(env(safe-area-inset-bottom) + 16px)}
.sheet h2{font-size:18px;margin:0 0 4px}
.sheet p{font-size:14px;color:var(--text2);margin:6px 0 12px}
.sheet .item{display:block;width:100%;text-align:left;padding:12px 12px;border-radius:12px;background:var(--cell);border:1px solid var(--lineCtl);margin-top:8px}
.sheet .item b{display:block;font-size:16px}
.sheet .item span{display:block;font-size:13px;color:var(--text2);margin-top:2px}
.sheet .item:active{background:var(--pressed)}
.sheet .item.main{background:var(--accent);border-color:var(--accent);color:var(--onAccent)}
.sheet .item.main span{color:#0F3B30}
.sheet .foot{font-size:12px;color:var(--text3);margin-top:14px}
.sheet ol{padding-left:20px;margin:6px 0;font-size:14px;color:var(--text2)}
.sheet ol li{margin:4px 0}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <button class="icon" id="prev" aria-label="Попередній місяць"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="title" id="monthName"></div>
    <button class="icon" id="next" aria-label="Наступний місяць"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
    <button class="icon" id="menuBtn" aria-label="Меню"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></button>
  </header>

  <div id="banner" class="banner hidden"></div>

  <section class="card hero">
    <div class="row1">
      <div class="label" id="heroLabel">За місяць</div>
      <div class="seg" id="dispSeg" role="group" aria-label="Валюта підсумків">
        <button data-c="UAH">₴</button><button data-c="USD">$</button><button data-c="EUR">€</button>
      </div>
    </div>
    <div class="big" id="heroBig"></div>
    <div class="sec" id="heroSec"></div>
    <div class="note" id="heroNote"></div>
  </section>

  <section class="card">
    <div class="wk"><div>пн</div><div>вт</div><div>ср</div><div>чт</div><div>пт</div><div>сб</div><div>нд</div></div>
    <div class="grid" id="grid"></div>
    <div class="calfoot" id="calFoot"></div>
  </section>

  <section class="card" id="dayCard">
    <div class="dayhead"><div class="d" id="dayTitle"></div><div class="t" id="dayTotal"></div></div>
    <div class="rows" id="rows"></div>
    <div class="editor" id="editor">
      <div class="inrow">
        <input id="amt" type="text" inputmode="decimal" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="done" placeholder="Сума" aria-label="Сума">
        <div class="seg" id="inSeg" role="group" aria-label="Валюта суми">
          <button data-c="UAH">₴</button><button data-c="USD">$</button><button data-c="EUR">€</button>
        </div>
      </div>
      <div class="hint" id="amtHint"></div>
      <div class="btns">
        <button class="primary" id="save">Зберегти</button>
        <button class="ghost danger hidden" id="del">Видалити</button>
        <button class="ghost hidden" id="cancel">Скасувати</button>
      </div>
    </div>
    <button class="link hidden" id="addMore">+ Додати ще суму</button>
    <div class="rate" id="rateLine"></div>
  </section>

  <section class="card">
    <div class="yhead"><span class="label" id="yLabel"></span><b id="yTotal"></b></div>
    <div class="bars" id="bars"></div>
    <div class="ynote" id="yNote"></div>
  </section>
</div>

<div class="toast hidden" id="toast"><span id="toastText"></span><button id="toastUndo">Повернути</button></div>
<div class="shade hidden" id="shade"><div class="sheet" id="sheet"></div></div>
<input type="file" id="file" accept=".txt,text/plain" class="hidden">
<script src="app.js?v=1"></script>
</body>
</html>
